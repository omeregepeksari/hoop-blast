<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1530">
<title>Hoop Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#0b1530;--bg2:#04060d;--orange:#ff7a1a;--led:#ff3b30;--gold:#ffcc00;--text:#f4f1ea}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% -10%,#24407a 0%,var(--bg1) 45%,var(--bg2) 100%);
    color:var(--text);font-family:Orbitron,system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  }
  header{width:100%;max-width:464px;padding:12px 12px 10px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{font-family:Bungee,Impact,sans-serif;font-size:clamp(22px,7vw,30px);letter-spacing:1px;color:var(--orange);
     text-shadow:0 3px 0 #7a2e00,0 0 22px rgba(255,122,26,.45);line-height:1}
  h1 span{color:#fff;text-shadow:0 3px 0 #333,0 0 18px rgba(255,255,255,.25)}
  .btns{display:flex;gap:6px}
  button.icon{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;
     width:40px;height:40px;font-size:18px;cursor:pointer;display:grid;place-items:center}
  button.icon:hover{background:rgba(255,255,255,.16)}
  .scoreboard{margin-top:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;background:#0d0d0d;
     border:3px solid #2b2b2b;border-radius:12px;padding:6px 10px;box-shadow:inset 0 0 22px #000,0 8px 24px rgba(0,0,0,.55)}
  .sb{text-align:center}
  .lbl{font-size:9px;letter-spacing:2px;color:#9a9a9a}
  .val{font-size:clamp(20px,6.5vw,28px);font-weight:900;color:var(--led);text-shadow:0 0 10px rgba(255,59,48,.85);font-variant-numeric:tabular-nums}
  .val.best{color:var(--gold);text-shadow:0 0 10px rgba(255,204,0,.7)}
  .mid{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:86px;border-left:1px solid #222;border-right:1px solid #222;padding:0 8px}
  #streak{font-size:15px;font-weight:900;color:#ffb067;text-shadow:0 0 8px rgba(255,140,0,.6);margin-top:2px}
  .hint{margin-top:8px;font-size:10px;letter-spacing:1px;color:#8090b0;text-align:center}
  canvas{display:block;touch-action:none;cursor:grab}
  #overlay{position:fixed;inset:0;background:rgba(2,4,10,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  #overlay.show{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:linear-gradient(180deg,#1a2342,#0c1226);border:2px solid #34407a;border-radius:18px;padding:26px 24px;text-align:center;
        width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h2{font-family:Bungee,Impact,sans-serif;font-size:30px;color:var(--led);text-shadow:0 0 16px rgba(255,59,48,.6)}
  .card .big{font-size:48px;font-weight:900;margin:14px 0 4px;color:#fff}
  .card .sub{font-size:12px;letter-spacing:2px;color:#9aa6c8}
  #record{font-family:Bungee,Impact,sans-serif;color:var(--gold);margin-top:10px;font-size:18px;display:none}
  .play{margin-top:22px;font-family:Bungee,Impact,sans-serif;font-size:18px;color:#fff;background:linear-gradient(180deg,#ff8f3a,#e2570b);
        border:none;border-radius:14px;padding:14px 28px;cursor:pointer;box-shadow:0 5px 0 #8a3300,0 10px 24px rgba(255,122,26,.35)}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3300}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>HOOP <span>BLAST</span></h1>
    <div class="btns">
      <button class="icon" id="mute" title="Sound">🔊</button>
      <button class="icon" id="restart" title="New game">↻</button>
    </div>
  </div>
  <div class="scoreboard">
    <div class="sb"><div class="lbl">HOME</div><div class="val" id="score">0</div></div>
    <div class="mid"><div class="lbl">STREAK</div><div id="streak">—</div></div>
    <div class="sb"><div class="lbl">BEST</div><div class="val best" id="best">0</div></div>
  </div>
  <div class="hint">DRAG BALLS ONTO THE COURT · FILL A ROW OR COLUMN TO SCORE</div>
</header>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h2>FINAL BUZZER</h2>
    <div class="big" id="final">0</div>
    <div class="sub">BEST <span id="finalBest">0</span></div>
    <div id="record">🏆 NEW RECORD!</div>
    <button class="play" id="again">RUN IT BACK</button>
  </div>
</div>

<script>
(() => {
  const N = 8;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- Pieces ----------
  const BASE = [
    [['#'], 1],
    [['##'], 2],
    [['###'], 2],
    [['####'], 2],
    [['#####'], 1],
    [['##', '##'], 3],
    [['###', '###', '###'], 1],
    [['###', '###'], 2],
    [['#.', '##'], 3],
    [['#..', '#..', '###'], 2],
    [['#.', '#.', '##'], 3],
    [['###', '.#.'], 2],
    [['##.', '.##'], 2],
    [['#.', '.#'], 1],
    [['#..', '.#.', '..#'], 1],
  ];
  const norm = cells => {
    const mr = Math.min(...cells.map(c => c[0])), mc = Math.min(...cells.map(c => c[1]));
    return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  };
  const SHAPES = []; // [{cells,w,h}, weight]
  for (const [rows, weight] of BASE) {
    let cells = [];
    rows.forEach((row, r) => [...row].forEach((ch, c) => ch === '#' && cells.push([r, c])));
    const seen = new Set(), variants = [];
    for (let k = 0; k < 4; k++) {
      cells = norm(cells);
      const key = JSON.stringify(cells);
      if (!seen.has(key)) { seen.add(key); variants.push(cells); }
      const maxR = Math.max(...cells.map(c => c[0]));
      cells = cells.map(([r, c]) => [c, maxR - r]);
    }
    for (const v of variants) SHAPES.push([{
      cells: v,
      h: Math.max(...v.map(c => c[0])) + 1,
      w: Math.max(...v.map(c => c[1])) + 1,
    }, weight / variants.length]);
  }
  const TOTAL_W = SHAPES.reduce((s, x) => s + x[1], 0);

  const COLORS = [
    { light: '#ffa552', dark: '#e2570b', seam: '#3a1400' }, // classic leather
    { light: '#ff6f6f', dark: '#c81d25', seam: '#3d0005' },
    { light: '#62b0ff', dark: '#1d4fd8', seam: '#06163f' },
    { light: '#b98fff', dark: '#6a1fd1', seam: '#1f0544' },
    { light: '#64e494', dark: '#13914a', seam: '#03301a' },
    { light: '#ffe46e', dark: '#e0a800', seam: '#3d2b00' },
    { light: '#55ebe4', dark: '#0f9a9a', seam: '#00302f' },
  ];

  function randomPiece() {
    let x = Math.random() * TOTAL_W, shape = SHAPES[0][0];
    for (const [s, w] of SHAPES) { if ((x -= w) <= 0) { shape = s; break; } }
    return { ...shape, color: Math.floor(Math.random() * COLORS.length) };
  }

  // ---------- State ----------
  let grid, tray, score, shown, best, streak, sinceClear, over;
  let drag = null, anims = [], parts = [], pops = [], shake = 0;
  try { best = +localStorage.getItem('hoopblast-best') || 0; } catch (e) { best = 0; }

  const canPlace = (p, r, c, g = grid) => p.cells.every(([dr, dc]) => {
    const rr = r + dr, cc = c + dc;
    return rr >= 0 && rr < N && cc >= 0 && cc < N && g[rr][cc] === null;
  });
  const fits = p => {
    for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(p, r, c)) return true;
    return false;
  };
  const anyMoves = () => tray.some(p => p && fits(p));

  function refill() {
    for (let k = 0; k < 40; k++) {
      const t = [randomPiece(), randomPiece(), randomPiece()];
      if (t.some(fits) || k === 39) { tray = t; return; }
    }
  }

  function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    score = 0; shown = 0; streak = 0; sinceClear = 0; over = false;
    anims = []; parts = []; pops = []; drag = null;
    refill();
    $('overlay').classList.remove('show');
    hud();
  }

  function hud() {
    $('best').textContent = Math.max(best, score);
    $('streak').textContent = streak >= 2 ? `x${streak} 🔥` : streak === 1 ? 'x1' : '—';
  }

  // ---------- Layout ----------
  let dpr, W, H, cell, BS, TY, TH, court;
  const TS = 0.5; // tray scale
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const headH = document.querySelector('header').offsetHeight;
    const availW = Math.min(window.innerWidth - 24, 440);
    const availH = window.innerHeight - headH - 16;
    BS = Math.max(200, Math.floor(Math.min(availW, (availH - 14) / 1.4) / N) * N);
    cell = BS / N; TY = BS + 14; TH = cell * 3.1; W = BS; H = TY + TH;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    buildCourt();
  }

  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function buildCourt() {
    court = document.createElement('canvas');
    court.width = court.height = Math.round(BS * dpr);
    const g = court.getContext('2d');
    g.scale(dpr, dpr);
    rrect(g, 0, 0, BS, BS, 12); g.clip();
    // hardwood planks
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pw = cell / 2.5;
    for (let x = 0; x < BS; x += pw) {
      const l = rnd();
      g.fillStyle = `hsl(${28 + l * 7},${58 + l * 10}%,${50 + l * 9}%)`;
      g.fillRect(x, 0, pw + 1, BS);
      for (let i = 0; i < 6; i++) { // grain
        g.fillStyle = `rgba(110,55,10,${0.05 + rnd() * 0.07})`;
        g.fillRect(x + rnd() * pw, 0, 1, BS);
      }
      let y = -rnd() * cell * 3;
      while (y < BS) { y += cell * (2 + rnd() * 3); g.fillStyle = 'rgba(70,32,0,.35)'; g.fillRect(x, y, pw, 1.2); }
      g.fillStyle = 'rgba(70,32,0,.35)'; g.fillRect(x, 0, 1, BS);
    }
    // court markings
    const cx = BS / 2, lw = Math.max(2, cell * 0.07);
    g.lineWidth = lw; g.strokeStyle = 'rgba(255,255,255,.7)';
    g.fillStyle = 'rgba(180,25,40,.32)';
    g.fillRect(cx - cell * 1.6, BS - cell * 3.3, cell * 3.2, cell * 3.3);
    g.strokeRect(cx - cell * 1.6, BS - cell * 3.3, cell * 3.2, cell * 3.4);
    g.beginPath(); g.arc(cx, BS - cell * 3.3, cell * 1.6, Math.PI, 0); g.stroke();
    g.beginPath(); g.moveTo(cx - cell * 3.6, BS); g.lineTo(cx - cell * 3.6, BS - cell * 1.1);
    g.arc(cx, BS - cell * 1.1, cell * 3.6, Math.PI, 0); g.lineTo(cx + cell * 3.6, BS); g.stroke();
    g.beginPath(); g.arc(cx, 0, cell * 1.6, 0, Math.PI); g.stroke();
    g.fillStyle = 'rgba(30,60,160,.25)';
    g.beginPath(); g.arc(cx, 0, cell * 1.6, 0, Math.PI); g.fill();
    // cell slots
    const p = cell * 0.06;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      rrect(g, c * cell + p, r * cell + p, cell - 2 * p, cell - 2 * p, cell * 0.16);
      g.fillStyle = 'rgba(40,15,0,.2)'; g.fill();
      g.strokeStyle = 'rgba(40,15,0,.22)'; g.lineWidth = 1; g.stroke();
    }
    // vignette
    const v = g.createRadialGradient(cx, BS / 2, BS * 0.3, cx, BS / 2, BS * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = v; g.fillRect(0, 0, BS, BS);
  }

  // ---------- Drawing ----------
  function drawBall(x, y, s, ci, alpha = 1, glow = false) {
    const col = COLORS[ci], p = s * 0.05, r = s * 0.2;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (glow) { ctx.shadowColor = col.light; ctx.shadowBlur = s * 0.5; }
    rrect(ctx, x + p, y + p, s - 2 * p, s - 2 * p, r);
    const gr = ctx.createLinearGradient(x, y, x + s, y + s);
    gr.addColorStop(0, col.light); gr.addColorStop(1, col.dark);
    ctx.fillStyle = gr; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.clip();
    // basketball seams
    const cx = x + s / 2, cy = y + s / 2;
    ctx.strokeStyle = col.seam; ctx.globalAlpha = alpha * 0.8;
    ctx.lineWidth = Math.max(1, s * 0.05); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(cx, y + s);
    ctx.moveTo(x, cy); ctx.lineTo(x + s, cy);
    ctx.moveTo(x + s * 0.16, y); ctx.quadraticCurveTo(x + s * 0.46, cy, x + s * 0.16, y + s);
    ctx.moveTo(x + s * 0.84, y); ctx.quadraticCurveTo(x + s * 0.54, cy, x + s * 0.84, y + s);
    ctx.stroke();
    // gloss
    ctx.globalAlpha = alpha;
    const gl = ctx.createLinearGradient(0, y, 0, y + s * 0.6);
    gl.addColorStop(0, 'rgba(255,255,255,.45)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(x, y, s, s * 0.6);
    ctx.restore();
    // edge
    ctx.save(); ctx.globalAlpha = alpha * 0.6;
    rrect(ctx, x + p, y + p, s - 2 * p, s - 2 * p, r);
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = Math.max(1, s * 0.03); ctx.stroke();
    ctx.restore();
  }

  function drawPiece(p, x, y, s, alpha = 1) {
    for (const [r, c] of p.cells) drawBall(x + c * s, y + r * s, s, p.color, alpha);
  }

  // ---------- Input ----------
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };

  function dropTarget() {
    if (!drag) return null;
    const p = drag.p;
    const x = drag.x - p.w * cell / 2, y = drag.y - drag.lift - p.h * cell / 2;
    const c = Math.round(x / cell), r = Math.round(y / cell);
    return canPlace(p, r, c) ? { r, c } : null;
  }

  cv.addEventListener('pointerdown', e => {
    audio();
    if (over) return;
    const { x, y } = pos(e);
    if (y < TY - 10) return;
    const i = Math.min(2, Math.max(0, Math.floor(x / (W / 3))));
    if (!tray[i]) return;
    drag = { i, p: tray[i], x, y, lift: e.pointerType === 'mouse' ? cell * 0.4 : cell * 1.7 };
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
    sfx.pick();
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const { x, y } = pos(e); drag.x = x; drag.y = y;
  });
  const end = () => {
    if (!drag) return;
    const t = dropTarget();
    if (t) place(drag.i, t.r, t.c); else if (drag.y < TY - 10) sfx.miss();
    drag = null; cv.style.cursor = 'grab';
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', () => { drag = null; });

  // ---------- Game logic ----------
  function fullLines(g) {
    const rows = [], cols = [];
    for (let r = 0; r < N; r++) if (g[r].every(v => v !== null)) rows.push(r);
    for (let c = 0; c < N; c++) if (g.every(row => row[c] !== null)) cols.push(c);
    return { rows, cols };
  }

  const CALLS = ['', 'SWISH!', 'AND ONE!', 'FROM DOWNTOWN!', 'SLAM DUNK!', 'POSTERIZED!'];

  function place(i, r, c) {
    const p = tray[i];
    for (const [dr, dc] of p.cells) grid[r + dr][c + dc] = p.color;
    tray[i] = null;
    score += p.cells.length;
    sfx.place();

    const { rows, cols } = fullLines(grid);
    const lines = rows.length + cols.length;
    const now = performance.now();
    if (lines) {
      streak++; sinceClear = 0;
      const cleared = new Set();
      rows.forEach(rr => { for (let cc = 0; cc < N; cc++) cleared.add(rr * N + cc); });
      cols.forEach(cc => { for (let rr = 0; rr < N; rr++) cleared.add(rr * N + cc); });
      const cr = r + p.h / 2, cc0 = c + p.w / 2;
      let sx = 0, sy = 0;
      for (const k of cleared) {
        const rr = Math.floor(k / N), cc = k % N, color = grid[rr][cc];
        const delay = Math.hypot(rr + 0.5 - cr, cc + 0.5 - cc0) * 35;
        anims.push({ r: rr, c: cc, color, t0: now + delay });
        sx += cc; sy += rr;
        for (let j = 0; j < 3; j++) parts.push({
          x: (cc + 0.5) * cell, y: (rr + 0.5) * cell,
          vx: (Math.random() - 0.5) * 7, vy: -Math.random() * 7 - 2,
          r: cell * (0.07 + Math.random() * 0.09), color, life: 1, t0: now + delay,
        });
      }
      for (const k of cleared) grid[Math.floor(k / N)][k % N] = null;
      const pts = 10 * lines * lines + 10 * lines * (streak - 1);
      score += pts;
      const px = (sx / cleared.size + 0.5) * cell, py = (sy / cleared.size + 0.5) * cell;
      pop(CALLS[Math.min(lines, 5)], px, py, lines >= 3 ? 1.25 : 1, lines >= 3 ? '#ffcc00' : '#ffffff');
      pop('+' + pts, px, py + cell * 0.8, 0.6, '#ffb067', 120);
      if (streak >= 2) pop(streak >= 3 ? `ON FIRE x${streak}` : `HEATING UP x${streak}`, BS / 2, cell * 1.2, 0.8, '#ff6a2a', 220);
      if (grid.every(row => row.every(v => v === null))) {
        score += 300;
        pop('NOTHING BUT NET!', BS / 2, BS / 2 + cell, 1.05, '#55ebe4', 380);
        pop('+300', BS / 2, BS / 2 + cell * 1.9, 0.7, '#55ebe4', 420);
      }
      shake = Math.min(14, 3 + lines * 3);
      sfx.swish(lines);
      if (streak >= 2) setTimeout(() => sfx.combo(streak), 120);
    } else {
      pop('+' + p.cells.length, (c + p.w / 2) * cell, (r + p.h / 2) * cell, 0.5, 'rgba(255,255,255,.85)');
      if (++sinceClear >= 3) streak = 0;
    }
    if (tray.every(t => !t)) refill();
    hud();
    if (!anyMoves()) { over = true; setTimeout(gameOver, 800); }
  }

  function pop(text, x, y, size, color, delay = 0) {
    pops.push({ text, x, y, size, color, t0: performance.now() + delay });
  }

  function gameOver() {
    sfx.buzzer();
    const record = score > best;
    if (record) { best = score; try { localStorage.setItem('hoopblast-best', best); } catch (e) {} }
    $('final').textContent = score;
    $('finalBest').textContent = best;
    $('record').style.display = record && score > 0 ? 'block' : 'none';
    $('overlay').classList.add('show');
    hud();
  }

  // ---------- Render loop ----------
  function render(now) {
    shown += (score - shown) * 0.18;
    if (Math.abs(score - shown) < 0.5) shown = score;
    $('score').textContent = Math.round(shown);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0.3) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.86; } else shake = 0;

    // board
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    rrect(ctx, 0, 0, BS, BS, 12); ctx.fillStyle = '#5a2c08'; ctx.fill(); ctx.restore();
    ctx.drawImage(court, 0, 0, BS, BS);

    // preview
    const t = dropTarget();
    let hl = null;
    if (t) {
      const g2 = grid.map(row => row.slice());
      for (const [dr, dc] of drag.p.cells) g2[t.r + dr][t.c + dc] = drag.p.color;
      const { rows, cols } = fullLines(g2);
      if (rows.length || cols.length) {
        hl = new Set();
        rows.forEach(rr => { for (let cc = 0; cc < N; cc++) hl.add(rr * N + cc); });
        cols.forEach(cc => { for (let rr = 0; rr < N; rr++) hl.add(rr * N + cc); });
      }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = grid[r][c];
      if (v === null) continue;
      const h = hl && hl.has(r * N + c);
      drawBall(c * cell, r * cell, cell, h ? drag.p.color : v, 1, h);
    }
    if (t) for (const [dr, dc] of drag.p.cells) drawBall((t.c + dc) * cell, (t.r + dr) * cell, cell, drag.p.color, hl ? 0.8 : 0.42, !!hl);

    // clear animations
    anims = anims.filter(a => {
      const k = (now - a.t0) / 320;
      if (k < 0) { drawBall(a.c * cell, a.r * cell, cell, a.color, 1, true); return true; }
      if (k >= 1) return false;
      const s = cell * (1 + k * 0.35), off = (cell - s) / 2;
      drawBall(a.c * cell + off, a.r * cell + off - k * cell * 0.3, s, a.color, 1 - k, true);
      return true;
    });

    // tray
    ctx.save();
    rrect(ctx, 0, TY, W, TH, 14); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.stroke();
    ctx.restore();
    const ts = cell * TS;
    tray.forEach((p, i) => {
      if (!p || (drag && drag.i === i)) return;
      const cx = W * (i + 0.5) / 3, cy = TY + TH / 2;
      drawPiece(p, cx - p.w * ts / 2, cy - p.h * ts / 2, ts, fits(p) ? 1 : 0.3);
    });

    // particles
    parts = parts.filter(q => {
      if (now < q.t0) return true;
      q.vy += 0.35; q.x += q.vx; q.y += q.vy; q.life -= 0.022;
      if (q.life <= 0) return false;
      ctx.globalAlpha = q.life;
      ctx.fillStyle = COLORS[q.color].light;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = COLORS[q.color].seam; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(q.x - q.r, q.y); ctx.lineTo(q.x + q.r, q.y); ctx.stroke();
      ctx.globalAlpha = 1;
      return true;
    });

    // dragged piece
    if (drag) {
      const p = drag.p, s = t ? cell : cell * 0.92;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 10;
      drawPiece(p, drag.x - p.w * s / 2, drag.y - drag.lift - p.h * s / 2, s, 0.95);
      ctx.restore();
    }

    // popups
    pops = pops.filter(o => {
      const k = (now - o.t0) / 1150;
      if (k < 0) return true;
      if (k >= 1) return false;
      const sc = k < 0.15 ? 0.4 + (k / 0.15) * 0.75 : 1.15 - Math.min(0.15, (k - 0.15));
      const size = Math.max(14, cell * 0.62 * o.size) * sc;
      ctx.save();
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      ctx.font = `${size}px Bungee, Impact, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const x = Math.min(W - 10, Math.max(10, o.x)), y = o.y - k * cell * 0.9;
      const tw = ctx.measureText(o.text).width;
      const fx = Math.min(W - tw / 2 - 6, Math.max(tw / 2 + 6, x));
      ctx.lineWidth = size * 0.18; ctx.strokeStyle = 'rgba(20,8,0,.85)'; ctx.lineJoin = 'round';
      ctx.strokeText(o.text, fx, y);
      ctx.fillStyle = o.color; ctx.fillText(o.text, fx, y);
      ctx.restore();
      return true;
    });

    ctx.restore();
    requestAnimationFrame(render);
  }

  // ---------- Audio ----------
  let AC = null, muted = false;
  try { muted = localStorage.getItem('hoopblast-muted') === '1'; } catch (e) {}
  $('mute').textContent = muted ? '🔇' : '🔊';
  function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
  }
  function tone(f, dur, type = 'sine', vol = 0.2, to, when = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, f1, f2, vol) {
    if (!AC || muted) return;
    const t = AC.currentTime, len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(bp).connect(g).connect(AC.destination); src.start(t);
  }
  const sfx = {
    pick: () => tone(700, 0.05, 'triangle', 0.06),
    miss: () => tone(220, 0.1, 'triangle', 0.08, 140),
    place: () => { tone(150, 0.2, 'sine', 0.5, 50); tone(900, 0.03, 'square', 0.03); },
    swish: n => { noise(0.42 + n * 0.04, 1800, 6500, 0.35); if (n >= 3) tone(523, 0.4, 'triangle', 0.1, 1046, 0.1); },
    combo: s => [0, 4, 7, 12].slice(0, Math.min(4, s)).forEach((st, i) =>
      tone(440 * Math.pow(2, (st + Math.min(s, 6)) / 12), 0.15, 'triangle', 0.12, null, i * 0.07)),
    buzzer: () => { tone(160, 1.1, 'square', 0.1); tone(163, 1.1, 'sawtooth', 0.07); },
  };

  // ---------- Buttons ----------
  $('mute').onclick = () => {
    muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('hoopblast-muted', muted ? '1' : '0'); } catch (e) {}
  };
  $('restart').onclick = () => { if (score > best) { best = score; try { localStorage.setItem('hoopblast-best', best); } catch (e) {} } newGame(); };
  $('again').onclick = () => { audio(); newGame(); };
  window.addEventListener('resize', layout);

  layout();
  newGame();
  requestAnimationFrame(render);
  if (document.fonts) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
