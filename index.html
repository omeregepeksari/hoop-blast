<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07021a">
<title>Hoop Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#00f0ff;--pink:#ff2bd6;--yellow:#ffe14d;--text:#e8f6ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#05010f;color:var(--text);font-family:Orbitron,system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
  header{width:100%;max-width:420px;padding:14px 12px 10px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{font-family:Audiowide,Orbitron,sans-serif;font-size:clamp(22px,7vw,30px);letter-spacing:2px;line-height:1;
     background:linear-gradient(90deg,var(--cyan),#8a7bff 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 0 10px rgba(0,240,255,.45))}
  .tag{font-size:9px;letter-spacing:4px;color:rgba(0,240,255,.6);margin-top:4px}
  .btns{display:flex;gap:6px}
  button.icon{background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.35);color:var(--cyan);border-radius:8px;
     width:38px;height:38px;font-size:16px;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 12px rgba(0,240,255,.15) inset}
  button.icon:hover{background:rgba(0,240,255,.15);box-shadow:0 0 14px rgba(0,240,255,.4)}
  .hud{margin-top:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;position:relative;
     background:linear-gradient(180deg,rgba(20,30,70,.55),rgba(10,8,35,.55));backdrop-filter:blur(6px);
     border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:8px 10px;
     box-shadow:0 0 24px rgba(0,240,255,.12),inset 0 0 24px rgba(0,240,255,.06);
     clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  .sb{text-align:center}
  .lbl{font-size:8px;letter-spacing:3px;color:rgba(200,230,255,.55)}
  .val{font-size:clamp(20px,6.5vw,26px);font-weight:900;color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,.8);font-variant-numeric:tabular-nums}
  .val.best{color:var(--pink);text-shadow:0 0 12px rgba(255,43,214,.8)}
  .mid{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:86px;
       border-left:1px solid rgba(0,240,255,.15);border-right:1px solid rgba(0,240,255,.15);padding:0 8px}
  #lines{font-size:clamp(16px,5vw,20px);font-weight:900;color:var(--yellow);text-shadow:0 0 10px rgba(255,225,77,.7);margin-top:2px}
  .combo{margin-top:8px;padding:7px 10px 8px;border:1px solid rgba(0,240,255,.22);border-radius:8px;
     background:linear-gradient(180deg,rgba(20,30,70,.45),rgba(10,8,35,.45));transition:box-shadow .3s,border-color .3s}
  .combo-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #comboX{font-size:15px;font-weight:900;color:#fff;min-width:44px;transition:color .3s,text-shadow .3s}
  #comboTag{flex:1;font-size:9px;letter-spacing:3px;color:rgba(200,230,255,.55)}
  .pips{display:flex;gap:4px;align-items:center}
  .pips .lbl{margin-right:2px}
  .pips i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.12);transform:rotate(45deg);transition:background .25s,box-shadow .25s}
  .pips i.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
  .bar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
  #comboFill{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;
     background:linear-gradient(90deg,#12d6f0,#ffc928 45%,#ff7a1a 70%,#ff3fd0);background-size:360px 100%;
     box-shadow:0 0 12px rgba(255,201,40,.6);transition:width .35s cubic-bezier(.2,1.4,.4,1)}
  .bar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(5,1,15,.85) calc(10% - 2px) 10%)}
  .combo.hot{border-color:rgba(255,122,26,.7);animation:hot .6s ease-in-out infinite alternate}
  .combo.hot #comboX{color:#ffc928;text-shadow:0 0 12px #ff7a1a}
  .combo.max #comboX{color:#ff3fd0;text-shadow:0 0 14px #ff3fd0}
  @keyframes hot{from{box-shadow:0 0 8px rgba(255,122,26,.25)}to{box-shadow:0 0 22px rgba(255,122,26,.6)}}
  .combo.bump{animation:bump .35s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
  .hint{margin-top:8px;font-size:8px;letter-spacing:2px;color:rgba(160,190,255,.5);text-align:center}
  canvas#game{display:block;touch-action:none;cursor:grab}
  #overlay{position:fixed;inset:0;background:rgba(3,1,12,.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  #overlay.show{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{background:linear-gradient(180deg,rgba(25,20,70,.9),rgba(8,6,28,.95));border:1px solid rgba(255,43,214,.5);
        padding:28px 24px;text-align:center;width:100%;max-width:340px;
        box-shadow:0 0 40px rgba(255,43,214,.25),inset 0 0 30px rgba(0,240,255,.08);
        clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
  .card h2{font-family:Audiowide,Orbitron,sans-serif;font-size:28px;color:#fff;letter-spacing:2px;
           text-shadow:-2px 0 var(--pink),2px 0 var(--cyan),0 0 18px rgba(255,43,214,.6);animation:glitch 2.4s infinite}
  @keyframes glitch{0%,92%,100%{transform:none}93%{transform:translateX(-3px) skewX(8deg)}95%{transform:translateX(3px)}97%{transform:translateX(-1px) skewX(-6deg)}}
  .card .big{font-size:50px;font-weight:900;margin:14px 0 4px;color:var(--cyan);text-shadow:0 0 18px rgba(0,240,255,.8)}
  .card .sub{font-size:11px;letter-spacing:3px;color:rgba(200,220,255,.6)}
  #record{font-family:Audiowide,sans-serif;color:var(--yellow);margin-top:10px;font-size:16px;letter-spacing:2px;display:none;text-shadow:0 0 12px rgba(255,225,77,.7)}
  .play{margin-top:22px;font-family:Audiowide,Orbitron,sans-serif;font-size:16px;letter-spacing:2px;color:#05010f;
        background:linear-gradient(90deg,var(--cyan),var(--pink));border:none;padding:14px 30px;cursor:pointer;
        box-shadow:0 0 24px rgba(0,240,255,.5);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
  .play:hover{filter:brightness(1.15)}
  .play:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <div class="top">
    <div>
      <h1>HOOP BLAST</h1>
      <div class="tag">// NEON LEAGUE</div>
    </div>
    <div class="btns">
      <button class="icon" id="mute" title="Sound">🔊</button>
      <button class="icon" id="restart" title="New game">↻</button>
    </div>
  </div>
  <div class="hud">
    <div class="sb"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
    <div class="mid"><div class="lbl">LINES</div><div id="lines">0</div></div>
    <div class="sb"><div class="lbl">BEST</div><div class="val best" id="best">0</div></div>
  </div>
  <div class="combo" id="combo">
    <div class="combo-top">
      <span id="comboX">x0</span><span id="comboTag">COMBO</span>
      <span class="pips" title="Moves left to keep the combo"><span class="lbl">KEEP</span><i></i><i></i><i></i></span>
    </div>
    <div class="bar"><div id="comboFill"></div><div class="ticks"></div></div>
  </div>
  <div class="hint">DRAG BALLS ONTO THE COURT · FILL A ROW OR COLUMN TO SCORE</div>
</header>
<canvas id="game"></canvas>

<div id="overlay">
  <div class="card">
    <h2>FINAL BUZZER</h2>
    <div class="big" id="final">0</div>
    <div class="sub">BEST <span id="finalBest">0</span></div>
    <div id="record">◆ NEW RECORD ◆</div>
    <button class="play" id="again">RUN IT BACK</button>
  </div>
</div>

<script>
(() => {
  const N = 8;
  const M = 22; // margin around the board for glow / corner brackets
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- Pieces ----------
  const BASE = [
    [['#'], 1],
    [['##'], 2],
    [['###'], 2],
    [['####'], 2],
    [['#####'], 1],
    [['##', '##'], 3],
    [['###', '###', '###'], 1],
    [['###', '###'], 2],
    [['#.', '##'], 3],
    [['#..', '#..', '###'], 2],
    [['#.', '#.', '##'], 3],
    [['###', '.#.'], 2],
    [['##.', '.##'], 2],
    [['#.', '.#'], 1],
    [['#..', '.#.', '..#'], 1],
  ];
  const norm = cells => {
    const mr = Math.min(...cells.map(c => c[0])), mc = Math.min(...cells.map(c => c[1]));
    return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  };
  const SHAPES = [];
  for (const [rows, weight] of BASE) {
    let cells = [];
    rows.forEach((row, r) => [...row].forEach((ch, c) => ch === '#' && cells.push([r, c])));
    const seen = new Set(), variants = [];
    for (let k = 0; k < 4; k++) {
      cells = norm(cells);
      const key = JSON.stringify(cells);
      if (!seen.has(key)) { seen.add(key); variants.push(cells); }
      const maxR = Math.max(...cells.map(c => c[0]));
      cells = cells.map(([r, c]) => [c, maxR - r]);
    }
    for (const v of variants) SHAPES.push([{
      cells: v,
      h: Math.max(...v.map(c => c[0])) + 1,
      w: Math.max(...v.map(c => c[1])) + 1,
    }, weight / variants.length]);
  }
  const TOTAL_W = SHAPES.reduce((s, x) => s + x[1], 0);

  const COLORS = [
    { c: '#ff7a1a', rgb: '255,122,26' },  // basketball orange
    { c: '#12d6f0', rgb: '18,214,240' },
    { c: '#ff3fd0', rgb: '255,63,208' },
    { c: '#5fe03c', rgb: '95,224,60' },
    { c: '#8b5cff', rgb: '139,92,255' },
    { c: '#ffc928', rgb: '255,201,40' },
    { c: '#ff3d63', rgb: '255,61,99' },
  ];
  const shade = (rgb, f) => {
    const v = rgb.split(',').map(Number).map(x => Math.round(f > 0 ? x + (255 - x) * f : x * (1 + f)));
    return `rgb(${v.join(',')})`;
  };

  function randomPiece() {
    let x = Math.random() * TOTAL_W, shape = SHAPES[0][0];
    for (const [s, w] of SHAPES) { if ((x -= w) <= 0) { shape = s; break; } }
    return { ...shape, color: Math.floor(Math.random() * COLORS.length) };
  }

  // ---------- State ----------
  let grid, tray, score, shown, best, streak, sinceClear, over, totalLines;
  let drag = null, anims = [], parts = [], pops = [], beams = [], rings = [], sparks = [], flash = 0, shake = 0, edge = null;
  try { best = +localStorage.getItem('hoopblast-best') || 0; } catch (e) { best = 0; }

  const canPlace = (p, r, c, g = grid) => p.cells.every(([dr, dc]) => {
    const rr = r + dr, cc = c + dc;
    return rr >= 0 && rr < N && cc >= 0 && cc < N && g[rr][cc] === null;
  });
  const fits = p => {
    for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(p, r, c)) return true;
    return false;
  };
  const anyMoves = () => tray.some(p => p && fits(p));

  function refill() {
    for (let k = 0; k < 40; k++) {
      const t = [randomPiece(), randomPiece(), randomPiece()];
      if (t.some(fits) || k === 39) { tray = t; return; }
    }
  }

  function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    score = 0; shown = 0; streak = 0; sinceClear = 0; over = false; totalLines = 0;
    anims = []; parts = []; pops = []; beams = []; rings = []; sparks = []; edge = null; drag = null;
    refill();
    if (location.hash === '#demo') { // preset board one move from a double clear, for previewing effects
      for (const r of [N - 2, N - 1]) for (let c = 0; c < N - 1; c++) grid[r][c] = (r + c) % COLORS.length;
      tray[0] = { cells: [[0, 0], [1, 0]], w: 1, h: 2, color: 0 };
    }
    $('overlay').classList.remove('show');
    hud();
  }

  function hud() {
    $('best').textContent = Math.max(best, score);
    $('lines').textContent = totalLines;
    const box = $('combo');
    $('comboX').textContent = 'x' + streak;
    $('comboTag').textContent = streak >= 6 ? 'UNSTOPPABLE' : streak >= 3 ? 'ON FIRE 🔥' : streak === 2 ? 'HEATING UP' : 'COMBO';
    $('comboFill').style.width = Math.min(streak, 10) * 10 + '%';
    box.querySelectorAll('.pips i').forEach((el, i) => el.classList.toggle('on', streak > 0 && i < 3 - sinceClear));
    box.classList.toggle('hot', streak >= 3);
    box.classList.toggle('max', streak >= 6);
  }

  // ---------- Layout ----------
  let dpr, W, H, cell, BS, TY, TH, court, sprites;
  const TS = 0.5;
  const PAD = 0.4; // sprite glow padding (fraction of cell)
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const headH = document.querySelector('header').offsetHeight;
    const availW = Math.min(window.innerWidth - 24 - 2 * M, 360);
    const availH = window.innerHeight - headH - 16 - 2 * M;
    BS = Math.max(216, Math.floor(Math.min(availW, (availH - 14) / 1.36) / N) * N);
    cell = BS / N; TY = BS + 14; TH = cell * 3.2; W = BS; H = TY + TH;
    cv.style.width = (W + 2 * M) + 'px'; cv.style.height = (H + 2 * M) + 'px';
    cv.width = Math.round((W + 2 * M) * dpr); cv.height = Math.round((H + 2 * M) * dpr);
    buildCourt();
    buildSprites();
    bgResize();
  }

  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function buildCourt() {
    court = document.createElement('canvas');
    court.width = court.height = Math.round(BS * dpr);
    const g = court.getContext('2d');
    g.scale(dpr, dpr);
    rrect(g, 0, 0, BS, BS, 8); g.clip();
    const bgG = g.createLinearGradient(0, 0, 0, BS);
    bgG.addColorStop(0, '#0b1236'); bgG.addColorStop(1, '#070420');
    g.fillStyle = bgG; g.fillRect(0, 0, BS, BS);
    // fine tech grid
    g.strokeStyle = 'rgba(0,240,255,.05)'; g.lineWidth = 1;
    for (let i = 0; i <= N * 3; i++) {
      const v = i * cell / 3;
      g.beginPath(); g.moveTo(v, 0); g.lineTo(v, BS); g.moveTo(0, v); g.lineTo(BS, v); g.stroke();
    }
    // neon court markings
    const cx = BS / 2;
    const u = BS / 9; // markings scale with the board, not the cell count
    g.lineWidth = Math.max(1.5, u * 0.05);
    g.shadowBlur = 10;
    g.strokeStyle = 'rgba(255,43,214,.55)'; g.shadowColor = '#ff2bd6';
    g.fillStyle = 'rgba(255,43,214,.07)';
    // paint + free-throw circle (top of circle sits 4.5 cells up)
    g.fillRect(cx - u * 1.5, BS - u * 3, u * 3, u * 3);
    g.strokeRect(cx - u * 1.5, BS - u * 3, u * 3, u * 3.1);
    g.beginPath(); g.arc(cx, BS - u * 3, u * 1.5, Math.PI, 0); g.stroke();
    g.setLineDash([u * 0.2, u * 0.16]);
    g.beginPath(); g.arc(cx, BS - u * 3, u * 1.5, 0, Math.PI); g.stroke();
    g.setLineDash([]);
    // rim + backboard
    g.beginPath(); g.moveTo(cx - u * 0.5, BS - u * 0.35); g.lineTo(cx + u * 0.5, BS - u * 0.35); g.stroke();
    g.beginPath(); g.arc(cx, BS - u * 0.62, u * 0.24, 0, Math.PI * 2); g.stroke();
    // three-point line (top of arc 5.1 cells up, clearly outside the free-throw circle)
    g.strokeStyle = 'rgba(0,240,255,.5)'; g.shadowColor = '#00f0ff';
    const r3 = u * 4.3, by = BS - u * 0.8;
    g.beginPath(); g.moveTo(cx - r3, BS); g.lineTo(cx - r3, by);
    g.arc(cx, by, r3, Math.PI, 0); g.lineTo(cx + r3, BS); g.stroke();
    g.beginPath(); g.arc(cx, 0, u * 1.7, 0, Math.PI); g.stroke();
    g.beginPath(); g.arc(cx, 0, u * 0.6, 0, Math.PI); g.stroke();
    g.shadowBlur = 0;
    // cell slots
    const p = cell * 0.07;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      rrect(g, c * cell + p, r * cell + p, cell - 2 * p, cell - 2 * p, cell * 0.14);
      g.fillStyle = 'rgba(120,180,255,.035)'; g.fill();
      g.strokeStyle = 'rgba(0,240,255,.13)'; g.lineWidth = 1; g.stroke();
    }
    // 3x3 sector dividers
    g.strokeStyle = 'rgba(0,240,255,.22)'; g.lineWidth = 1;
    for (let i = N % 3 ? 4 : 3; i < N; i += N % 3 ? 4 : 3) {
      g.beginPath(); g.moveTo(i * cell, 0); g.lineTo(i * cell, BS); g.moveTo(0, i * cell); g.lineTo(BS, i * cell); g.stroke();
    }
  }

  // Pre-render each neon ball block (normal + glowing) for speed.
  function buildSprites() {
    sprites = COLORS.map(col => [false, true].map(glow => {
      const s = cell, pad = s * PAD, size = s + 2 * pad;
      const c = document.createElement('canvas');
      c.width = c.height = Math.ceil(size * dpr);
      const g = c.getContext('2d');
      g.scale(dpr, dpr); g.translate(pad, pad);
      const p = s * 0.05, r = s * 0.2, w = s - 2 * p, depth = s * 0.08;
      // outer glow + 3D base (darker bottom edge)
      g.shadowColor = col.c; g.shadowBlur = glow ? s * 0.6 : s * 0.18;
      rrect(g, p, p, w, w, r);
      g.fillStyle = shade(col.rgb, -0.45); g.fill();
      g.shadowBlur = 0;
      // top face
      const fh = w - depth;
      rrect(g, p, p, w, fh, r);
      const face = g.createLinearGradient(0, p, 0, p + fh);
      face.addColorStop(0, shade(col.rgb, glow ? 0.55 : 0.38));
      face.addColorStop(0.5, col.c);
      face.addColorStop(1, shade(col.rgb, -0.12));
      g.fillStyle = face; g.fill();
      // bevel highlight
      g.save(); rrect(g, p, p, w, fh, r); g.clip();
      const bev = g.createLinearGradient(0, p, 0, p + fh * 0.45);
      bev.addColorStop(0, 'rgba(255,255,255,.55)'); bev.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = bev; g.fillRect(p, p, w, fh * 0.45);
      g.restore();
      // inset inner panel
      const ip = s * 0.17;
      rrect(g, ip, ip, s - 2 * ip, s - 2 * ip - depth, r * 0.6);
      const inner = g.createLinearGradient(0, ip, 0, s - ip - depth);
      inner.addColorStop(0, 'rgba(0,0,0,.18)'); inner.addColorStop(1, 'rgba(255,255,255,.1)');
      g.fillStyle = inner; g.fill();
      g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = Math.max(1, s * 0.02); g.stroke();
      // basketball emblem
      const cx = s / 2, cy = (p + fh + p) / 2, br = s * 0.2;
      g.save();
      g.beginPath(); g.arc(cx, cy, br, 0, Math.PI * 2);
      const ball = g.createRadialGradient(cx - br * 0.35, cy - br * 0.35, br * 0.1, cx, cy, br);
      ball.addColorStop(0, 'rgba(255,255,255,.45)'); ball.addColorStop(1, 'rgba(255,255,255,.08)');
      g.fillStyle = ball; g.fill();
      g.clip();
      g.strokeStyle = shade(col.rgb, -0.55); g.lineWidth = Math.max(1, s * 0.03); g.lineCap = 'round';
      g.beginPath();
      g.moveTo(cx, cy - br); g.lineTo(cx, cy + br);
      g.moveTo(cx - br, cy); g.lineTo(cx + br, cy);
      g.moveTo(cx - br * 0.72, cy - br); g.quadraticCurveTo(cx - br * 0.15, cy, cx - br * 0.72, cy + br);
      g.moveTo(cx + br * 0.72, cy - br); g.quadraticCurveTo(cx + br * 0.15, cy, cx + br * 0.72, cy + br);
      g.stroke();
      g.restore();
      g.beginPath(); g.arc(cx, cy, br, 0, Math.PI * 2);
      g.strokeStyle = shade(col.rgb, -0.55); g.lineWidth = Math.max(1, s * 0.035); g.stroke();
      // crisp outline + top rim light
      rrect(g, p, p, w, w, r);

  // ---------- Animated background ----------

  // Hex pattern cached per resize
  let hex;

    hex = document.createElement('canvas');

    const g = hex.getContext('2d');

    g.strokeStyle = 'rgba(120,200,255,.07)'; g.lineWidth = 1;

    ctx.restore();
    const ts = cell * TS;
    tray.forEach((p, i) => {

  // ---------- Audio (synth) ----------
  let AC = null, muted = false;
  try { muted = localStorage.getItem('hoopblast-muted') === '1'; } catch (e) {}
  $('mute').textContent = muted ? '🔇' : '🔊';
  function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
  }
  function tone(f, dur, type = 'sine', vol = 0.2, to, when = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, f1, f2, vol) {
    if (!AC || muted) return;
    const t = AC.currentTime, len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(bp).connect(g).connect(AC.destination); src.start(t);
  }
  const sfx = {
    pick: () => tone(1200, 0.04, 'sine', 0.05, 1800),
    miss: () => tone(300, 0.12, 'square', 0.04, 120),
    place: () => { tone(110, 0.18, 'sine', 0.45, 45); tone(880, 0.06, 'triangle', 0.05, 1320); },
    clear: n => {
      noise(0.4, 1500, 7000, 0.28);
      tone(220, 0.35, 'sawtooth', 0.06, 1760);
      if (n >= 2) tone(330, 0.4, 'square', 0.04, 2640, 0.05);
    },
    combo: s => [0, 4, 7, 12].slice(0, Math.min(4, s)).forEach((st, i) =>
      tone(523 * Math.pow(2, (st + Math.min(s, 6)) / 12), 0.14, 'square', 0.05, null, i * 0.06)),
    buzzer: () => { tone(150, 1.1, 'sawtooth', 0.09, 70); tone(152, 1.1, 'square', 0.06, 72); },
  };

  // ---------- Buttons ----------
  $('mute').onclick = () => {
    muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('hoopblast-muted', muted ? '1' : '0'); } catch (e) {}
  };
  $('restart').onclick = () => { if (score > best) { best = score; try { localStorage.setItem('hoopblast-best', best); } catch (e) {} } newGame(); };
  $('again').onclick = () => { audio(); newGame(); };
  window.addEventListener('resize', layout);

  layout();
  newGame();
  requestAnimationFrame(render);
  if (document.fonts) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
